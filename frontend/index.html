<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Traffic Intelligence Command Center</title><link rel="stylesheet" href="/assets/styles.css"/></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">AT</span><span>Traffic AI</span></div><nav><a class="active" href="#overview">Overview</a><a href="#map">Live Map</a><a href="#incidents">Incidents</a><a href="#simulation">Signals</a><a href="#analytics">Analytics</a></nav></aside><main><header><div><p class="eyebrow">SMART CITY OPERATIONS</p><h1>Traffic Command Center</h1></div><div class="header-actions"><span id="clock" class="clock"></span><button id="themeBtn" aria-label="Toggle theme">◐</button></div></header><section id="overview"><div class="status-row"><span class="live-dot"></span><span>System operational</span><span id="sourceLabel"></span></div><div id="metricGrid" class="metrics"></div></section><section class="grid-two"><article class="panel"><div class="panel-head"><h2>Monitored Network</h2><span class="tag">DATABASE LIVE</span></div><div id="map" class="map"><div class="road h1"></div><div class="road h2"></div><div class="road v1"></div><div class="road v2"></div><div id="mapMarkers"></div></div></article><article class="panel"><div class="panel-head"><h2>Hourly Traffic</h2><select id="chartRange"><option>Today</option><option>7 days</option></select></div><div id="trafficChart" class="chart"></div></article></section><section class="grid-two" id="incidents"><article class="panel"><div class="panel-head"><h2>Incident Queue</h2><button id="newIncidentBtn" class="primary">Report incident</button></div><div id="incidentList" class="table"></div></article><article class="panel" id="simulation"><div class="panel-head"><h2>Signal Simulator</h2><span class="tag warning">SIMULATION ONLY</span></div><div class="simulator"><div class="intersection"><div class="road-ns"></div><div class="road-ew"></div><div id="north" class="signal north green"></div><div id="east" class="signal east red"></div></div><div class="controls"><label>Traffic density <b id="densityValue">50%</b></label><input id="density" type="range" min="0" max="100" value="50"/><button id="toggleSim" class="primary">Start adaptive simulation</button><div id="signalOutput" class="signal-output"></div></div></div></article></section></main><dialog id="incidentDialog"><form id="incidentForm" method="dialog"><h2>Report suspected incident</h2><label>Title<input name="title" required minlength="3" placeholder="Stopped vehicle"/></label><label>Category<select name="category"><option>Potential collision</option><option>Vehicle breakdown</option><option>Road obstruction</option><option>Unusual traffic stoppage</option></select></label><label>Location<input name="location" required placeholder="MG Road Junction"/></label><label>Description<textarea name="description" rows="3"></textarea></label><div class="dialog-actions"><button value="cancel">Cancel</button><button class="primary" value="default">Submit report</button></div></form></dialog><script src="/assets/app.js"></script></body></html>
